[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# 覆盖率配置
addopts =
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --strict-markers
    -v

# 标记
markers =
    asyncio: 异步测试
    slow: 慢速测试
    integration: 集成测试
