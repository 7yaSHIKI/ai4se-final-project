<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI-Powered RSS Aggregator{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">📰 RSS Aggregator</h1>
            <ul class="nav-links">
                <li><a href="/" class="{% if request.url.path == '/' %}active{% endif %}">首页</a></li>
                <li><a href="/feeds" class="{% if request.url.path == '/feeds' %}active{% endif %}">订阅管理</a></li>
                <li><button onclick="refreshFeeds()" class="btn-refresh">🔄 刷新</button></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>AI-Powered RSS Aggregator | Powered by OpenAI GPT-4o-mini</p>
        </div>
    </footer>

    <script src="/static/js/main.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
